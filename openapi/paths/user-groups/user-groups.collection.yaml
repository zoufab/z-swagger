get:
  tags: [UserGroups]
  summary: Lister les groupes d'utilisateurs
  operationId: listUserGroups
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: Liste paginée des groupes
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/UserGroupListResponse
    '400':
      description: Paramètres invalides
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorResponse

post:
  tags: [UserGroups]
  summary: Créer un groupe d'utilisateurs
  operationId: createUserGroup
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/CreateUserGroupRequest
  responses:
    '201':
      description: Groupe créé
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/UserGroupResponse
    '400':
      description: Payload invalide
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorResponse
    '409':
      description: Le nom du groupe existe déjà
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorResponse
