type: object
required:
  - timestamp
  - status
  - error
  - message
  - path
properties:
  timestamp:
    type: string
    format: date-time
    example: '2026-01-10T10:40:20Z'
  status:
    type: integer
    example: 400
  error:
    type: string
    example: Bad Request
  message:
    type: string
    example: Validation failed
  path:
    type: string
    example: /api/v1/user-groups
