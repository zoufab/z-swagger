type: object
required:
  - id
  - name
  - description
  - enabled
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
    example: a038666d-0e6a-4571-8f95-c6a3308fefe2
  name:
    type: string
    minLength: 3
    maxLength: 50
    example: ADMINISTRATORS
  description:
    type: string
    maxLength: 255
    example: Groupe des administrateurs de la plateforme
  enabled:
    type: boolean
    example: true
  createdAt:
    type: string
    format: date-time
    example: '2026-01-10T10:40:20Z'
  updatedAt:
    type: string
    format: date-time
    example: '2026-01-12T08:10:00Z'
